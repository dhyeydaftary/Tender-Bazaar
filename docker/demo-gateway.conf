# Internal gateway for the server demo (docker-compose.demo-server.yml).
#
# One origin per app, so the browser calls the API same-origin at /api/v1 and
# the frontends need no absolute API URL baked in:
#
#   :8080  web   →  /api/*  api-server:4000   everything else  web:3000
#   :8081  admin →  /api/*  api-server:4000   everything else  admin:3001
#
# Published on 127.0.0.1 only. Reached privately through an SSH tunnel now, and
# later by a host reverse proxy (Caddy) that terminates HTTPS. Nothing else is
# routed: api-server's /health and every internal service stay unreachable.

# A host reverse proxy (later) connects from loopback or the Docker bridge; only
# then is its X-Forwarded-For trusted. Direct (tunnel) connections keep their own address.
set_real_ip_from 127.0.0.1;
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server_tokens off;
client_max_body_size 10m;

server {
  listen 8080;
  add_header X-Robots-Tag "noindex, nofollow" always;

  location = /gateway-health { access_log off; return 200 "ok\n"; }

  location /api/ {
    proxy_pass http://api-server:4000;
    proxy_set_header Host $host;
    # api-server trusts exactly one proxy hop: hand it the real client address.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location / {
    proxy_pass http://web:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }
}

server {
  listen 8081;
  add_header X-Robots-Tag "noindex, nofollow" always;

  location = /gateway-health { access_log off; return 200 "ok\n"; }

  location /api/ {
    proxy_pass http://api-server:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location / {
    proxy_pass http://admin:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }
}
