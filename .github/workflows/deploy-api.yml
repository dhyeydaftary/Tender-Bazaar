name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'packages/api-server/**'
      - 'packages/shared/**'
      - 'prisma/**'

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t tenderbazaar-api -f packages/api-server/Dockerfile .

