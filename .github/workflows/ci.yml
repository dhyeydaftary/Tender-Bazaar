name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Type Check - Shared
        run: pnpm --filter @tenderbazaar/shared type-check

      - name: Type Check - API Server
        run: pnpm --filter @tenderbazaar/api-server type-check

      - name: Type Check - Web
        run: pnpm --filter @tenderbazaar/web type-check

      - name: Type Check - Admin
        run: pnpm --filter @tenderbazaar/admin type-check

      - name: Type Check - Scraper Engine
        run: pnpm --filter @tenderbazaar/scraper-engine type-check

      - name: Type Check - Notification Service
        run: pnpm --filter @tenderbazaar/notification-service type-check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build all packages
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: 'true'

  ai-service:
    name: AI Service Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: packages/ai-service/requirements.txt

      - name: Install dependencies
        run: |
          cd packages/ai-service
          pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          pip install ruff
          cd packages/ai-service
          ruff check . || true

      - name: Type check with mypy
        run: |
          pip install mypy
          cd packages/ai-service
          mypy . --ignore-missing-imports || true
